name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...

      # Đường USB chỉ biên dịch trên Linux, nên vet riêng để bản !linux (stub
      # dùng khi dev trên macOS) không âm thầm mục nát.
      - name: vet darwin (stub)
        run: GOOS=darwin GOARCH=arm64 go vet ./...

      - run: go test ./... -race

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # amd64 cho PC/NUC ở quầy; arm64 cho mini-PC ARM.
      - name: build
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o dist/trcf-bridge-linux-$arch ./cmd/agent
          done
          sha256sum dist/* > dist/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # Ảnh Docker — cách PHÁT HÀNH duy nhất tới quán.
  #
  # Repo này private và `dist/` bị gitignore, nên quán không có đường nào `curl` binary
  # về. Đẩy lên GHCR thì họ dùng ĐÚNG token đã cấp lúc cài ERP (`read:packages`), không
  # phải xin thêm quyền gì. Một ảnh phục vụ cả hai kiểu cài: chạy thẳng bằng Docker,
  # hoặc moi binary ra đặt vào `/usr/local/bin` rồi chạy bằng systemd.
  #
  # Chạy cho MỌI lần push `main` (không chỉ khi gắn thẻ): quán cần bản vá gấp thì có
  # `:latest` dùng ngay, còn `:v*` vẫn là mốc phát hành đàng hoàng.
  image:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/nguyentrucanhtuan/trcf-bridge
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      # Nhãn phiên bản phải TRUY NGƯỢC ĐƯỢC ra mã nguồn. Bản gắn thẻ thì lấy tên thẻ;
      # bản đẩy thẳng `main` mà cũng để "main" thì lúc đi chữa máy in ở quán, `version`
      # chỉ nói được "đang chạy main" — không biết là main của tuần nào.
      - id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then echo "v=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else echo "v=main-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"; fi

      # arm64 cho mini-PC ARM ở quầy — cùng lý do bản binary build hai kiến trúc.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.ver.outputs.v }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
