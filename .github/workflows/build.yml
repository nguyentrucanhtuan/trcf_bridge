name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...

      # Đường USB chỉ biên dịch trên Linux, nên vet riêng để bản !linux (stub
      # dùng khi dev trên macOS) không âm thầm mục nát.
      - name: vet darwin (stub)
        run: GOOS=darwin GOARCH=arm64 go vet ./...

      - run: go test ./... -race

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # amd64 cho PC/NUC ở quầy; arm64 cho mini-PC ARM.
      - name: build
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o dist/trcf-print-agent-linux-$arch ./cmd/agent
          done
          sha256sum dist/* > dist/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
